<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />

        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html {
                width: 100vw;
                height: 100lvh;
            }

            body {
                overflow: hidden;
                font-family: Arial, Helvetica, sans-serif;
                font-size: 3lvh;
                background: navy;
            }

            #mainpage {
                background: navy;
                width: 92.5%;
                overflow: hidden;
                max-width: 100%;
                float: left;
                text-align: left;
                color: white;
                height: auto;
            }

            #mainpageleft {
                writing-mode: vertical-lr;
                float: left;
                color: dodgerBlue;

                padding-top: 5lvh;

                animation-iteration-count: 1;

            }

            tr {
                text-align: center;
            }

            td {
                width: calc(100vw / 6);
            }

            .spacer1lvh {
                display: flex;
                padding: 1lvh;
            }

            /* for each day */
            #createleaderboarditems {
                text-align: center;
                color: white;
                font-size: 4lvh;
                height: auto;
                display: block;
            }

            .team {
                width: 90%;
                /* ================================ */
                /* ================================ */
                /* ================================ */
                /* number 0f players + 5 ???        */
                /* ================================ */
                /* ================================ */
                /* ================================ */
                //height: calc(79lvh / 16); /* 16 players*/
                height: calc(100lvh / 17); /* 12 players*/

                margin-top: 1lvh;
                margin-bottom: 1lvh;

                align-items: center;
                transition-property: top;
                /* how fast ? is */

                border-radius: 5px; //10px;
                transition-timing-function: cubic-bezier(0.68, -0.55, 0.265, 1.55);
                border: 2px solid rgba(255, 255, 255, 0.3);
                //background-clip: padding-box;
                margin-left: 100%;
                box-shadow: inset 6px 6px 10px 0 rgba(0, 0, 0, 0.2), inset -6px -6px 10px 0 rgba(255, 255, 255, 0.2);
            }

            /* how fast it slides in */
            .animate {
                transform: translate3d(-105%, 0, 0);
                -webkit-transition: transform 0.5s ease;
            }

            .teamhcp {
                width: 90%;
                /* ================================ */
                /* ================================ */
                /* ================================ */
                /* number 0f players + 5 ???        */
                /* ================================ */
                /* ================================ */
                /* ================================ */
                //height: calc(79lvh / 16); /* 16 players*/
                height: calc(100lvh / 17); /* 12 players*/
                margin-left: 5%;
                margin-top: 1%;
                margin-bottom: 1%;
                padding-left: 5vw;
                background: rgba(105, 105, 105, 0.8);
                box-shadow: 0 3px 5px black;
                display: flex;
                align-items: center;
                transition-property: top;
                /* how fast ? is */
                transition-duration: 500ms;
                border-radius: 5px; //10px;
                transition-timing-function: cubic-bezier(0.68, -0.55, 0.265, 1.55);
                border: 2px solid rgba(255, 255, 255, 0.3);
            }

            .name {
                width: 35%;
                display: flex;
                align-items: center;
                justify-content: left;
                font-size: 3lvh;
                font-weight: 400;
            }

            .namehcp {
                width: 50%;
                display: flex;
                align-items: center;
                justify-content: left;
                font-size: 3lvh;
                font-weight: 400;
            }

            .scores {
                width: 40%;
                font-size: 3lvh;
                font-weight: 400;
                display: flex;
                text-align: center;
                justify-content: center;
                padding-left: 5lvh;
            }

            .tees {
                width: 35%;
                font-size: 2lvh;
                font-weight: 400;
                display: flex;
                text-align: center;
                justify-content: center;
                padding-left: 5lvh;
            }

            #tees0, #tees1, #tees2, #tees3,
            #hcps0, #hcps1, #hcps2, #hcps3,
            #namehcp0, #namehcp1, #namehcp2, #namehcp3 {
                color: white;
            }

            #tees4, #tees5, #tees6, #tees7,
            #hcps4, #hcps5, #hcps6, #hcps7,
            #namehcp4, #namehcp5, #namehcp6, #namehcp7 {
                color: cyan;
            }

            #tees8, #tees9, #tees10, #tees11,
            #hcps8, #hcps9, #hcps10, #hcps11,
            #namehcp8, #namehcp9, #namehcp10, #namehcp11 {
                color: yellow;
            }

            #tees12, #tees13, #tees14, #tees15,
            #hcps12, #hcps13, #hcps14, #hcps15,
            #namehcp12, #namehcp13, #namehcp14, #namehcp15 {
                color: limeGreen;
            }

            .position {
                width: 12%;
                font-size: 3lvh;
                font-weight: 400;
                display: flex;
                text-align: center;
                justify-content: center;
                
            }

            .day1, .day2, .day3, .day4, .dayfinal {
                width: 10%;
                font-size: 2lvh;
                font-weight: 400;
                display: flex;
                text-align: center;
                justify-content: center;
                color: silver;
                
                border: 1px solid silver;
                border-radius: 5px;
                
            }
            
            .dayfinal {
            	font-size: 3lvh;
            	color: white;
            }
            

            .hcpsadj {
                padding-left: 6lvh;
                width: auto;
                font-size: 2.5lvh;
                font-weight: 400;
                display: flex;
                text-align: center;
                justify-content: center;
            }

            #footerstats {
                position: absolute;
                bottom: 200px;
                width: 100%;
                font-size: 2.5lvh;
                display: flex;
                text-align: center;
                justify-content: center;
            }

            .birdgif, .birdgifnumber {
                width: 10%;
                visibility: hidden;
            }

            .numbird {
                width: 10%;
                visibility: hidden;
                text-align: center;
                color: cyan;
                font-size: 2lvh;
                font-style: italic;
            }

            .birdimg {
                height: 3.3lvh;
                display: flex;
                text-align: center;
                justify-content: center;
                padding-left: 1vw;
                padding-right: 1vw;
            }

            #statsinfo {
                width: 300px;
                height: 300px;
                border: 1px solid cyan;
                display: flex;
            }

            #toptr {
                color: cyan;
            }

            #statspanel {
                display: none;
                position: fixed;
                bottom: 25lvh;
                color: white;
                font-size: 4vw;
                width: 96%;
                margin-left: 2%;
                margin-top: 2%;
                margin-bottom: 2%;
                box-shadow: 0 3px 5px black;
                align-items: center;
                border-radius: 10px;
                //border: 1px solid silver;
                animation-name: expandfrommiddle;
                animation-duration: 0.7s;
                animation-timing-function: ease-out;
            }

            @keyframes expandfrommiddle {
                from {
                        scale: 0.1;
                        opacity: 0%;
                    }
                to {
                        scale: 1;
                        opacity: 100%;
                    }
            }

            @keyframes fade-in {
                from {
                        opacity: 0%;
                        scale: 0.2;
                    }
                to {
                        opacity: 100%;
                        scale: 1;
                    }
            }

            @keyframes slide-in {
                from {
                        translate: 0 -100lvh;
                }
                to {
                        translate: 0 0;
                }
            }

            /* DivTable.com */
            tr {
                color: white;
                background: black;
                font-size: 2lvh;
            }

            .static {
                color: cyan;
            }

            .bg {
                font-size: 3lvh;
            }

            #panel {
                display: none;
                position: fixed;
                top: 0;
                text-align: center;
                justify-content: center;
                height: 100%;
                width: 100%;
                left: 0;
                background: black;
                color: white;
                font-family: arial;
                font-size: 7lvh;
                border-radius: 5px;
                padding: 5lvh;
                padding-top: 20lvh;
            }

            .container {
                width: 100vw;
                height: 40lvh;
                position: fixed;
                top: 0;
                left: 0;
                background: navy;
                display: flex;
                flex-direction: column;
                align-items: stretch;
                justify-content: center;
                align-content: center;
            }

            .flex {
                min-height: 60pt;
            }

            @keyframes loading {
                0% {
                    width: 50pt;
                    height: 50pt;
                    margin-top: 0;
                }
                25% {
                    height: 4pt;
                    margin-top: 23pt;
                }
                50% {
                    width: 4pt;
                }
                75% {
                    width: 50pt;
                }
                100% {
                    width: 50pt;
                    height: 50pt;
                    margin-top: 0;
                }
            }

            .loader {
                    width: 50pt;
                    height: 50pt;
                    border-radius: 100%;
                    border: cyan 4pt solid;
                    margin-left: auto;
                    margin-right: auto;
                    background-color: transparent;
                    animation: loading 1s infinite;
            }

            .load-text {
                    padding-top: 15px;
                    text-align: center;
                    font-size: 3lvh;
                    color: cyan;
            }

            table {
                border-collapse: collapse;
                background: black;
            }

            #back {
                position: absolute;
                left: 5vw;
                top: 5vw;
            }

             #warning {
                                    display: none;
                                    position: absolute;
                                    top: 0;
                                    left: 0;
                                    background: indigo;
                                    width: 100vw;
                                    height: 100vh;
                                    z-index: 999;
                                    text-align: center;
                                    color: white;
                                    padding-top: 40vh;
                                    font-size: 6vh;
                                    font-family: 'Kalam';
                                  }

        </style>
    </head>
    <body>
        <div id="mainpageleft"></div>
        <div id="mainpage">
            <div id="createleaderboarditems">
                <!-- this is overwritten on start -->
                <div class="container">
                    <div class="flex">
                        <div class="loader"></div>
                    </div>
                    <div class="load-text">Loading...</div>
                </div>
                <!-- end of this is overwritten on start -->
            </div>
        </div>
        <div style="margin-top: 8px"></div>
       
        <!-- spacer -->
        <div class="spacer1lvh"></div>

        <div id="panel" onclick="closePanel()"></div>
         <div id="warning">Not available in landscape orientation</div>

        <script>
            //=================================================================================
            // this runs on startup or reload
            //
            //=================================================================================
            // Detect whether device supports orientationchange event, otherwise fall back to
      // the resize event.
      var supportsOrientationChange = "onorientationchange" in window,
        orientationEvent = supportsOrientationChange ? "orientationchange" : "resize";

      window.addEventListener(
        orientationEvent,
        function () {
          if (window.orientation == 0) {
            document.getElementById("warning").style.display = "none";
          } else if (window.orientation == 90 || window.orientation == -90) {
            document.getElementById("warning").style.display = "block";
          }
        },
        false
      );
            // prevent default img menu of options
            //document.addEventListener("contextmenu", (event) => {
            //    event.preventDefault();
            //});

            // declare global variables
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            var data;
            var getDataRetryCount = 0;
           

            //===========================
            // this code runs at startup
            //===========================
            getData();
            //=============================================================
            // functions - run when called
            //=============================================================

            //=============================================================
            // async function getData()
            // - gets results data
            //=============================================================
            async function getData() {
                var url = "https://opensheet.elk.sh/19wHh6ZzDbElLbV7rI9FMPqy7Op0W4LDRGis3mv-XT1U/points";
                try {
                    console.log("timeout delay = " + (getDataRetryCount * 1000 + 2000));
                    const dataStream = await fetch(url, {
                        signal: AbortSignal.timeout(getDataRetryCount * 1000 + 2000)
                    });
                    if (!dataStream.ok) {
                        throw new Error(`Response status: ${dataStream.status}`);
                    } else {
                        data = await dataStream.json();
                        $("#pagetwo").fadeIn(500);
                        document.getElementById("panel").style.display = "none";
                        if (data[0].player.length > 0) {
                            //console.log("Data Length = " + data.length);
                            //console.log(data);

                            // don't need blank players
                            // and sorts outdifference between 12 and 16 players
                            data = data.filter(function (el) {
                            return el.player !== "";
                            });

                            //console.log("Data Length = " + data.length);
                            console.log(data);

                            document.getElementById("panel").style.display = "none";
                            document.getElementById("mainpageleft").innerText = "Leaderboard for Overall Points";
                            useDataResults();
                        }
                    }
                } catch (err) {
                    console.error(err.message);
                    if (err.name === "TimeoutError") {
                        // This exception is from the abort signal
                        console.error("Timeout: server too busy");
                    } else if (err.name === "AbortError") {
                        // This exception is from the fetch itself
                        console.error("Fetch aborted by user action (browser stop button, closing tab, etc.");
                    } else if (err.name === "TypeError") {
                        console.error("AbortSignal.timeout() method is not supported");
                    } else {
                        // A network error, or some other problem.
                        console.error(`Error: type: ${err.name}, message: ${err.message}`);
                    }
                    // retry
                    getDataRetryCount++;
                    if (getDataRetryCount < 5) {
                        document.getElementsByClassName("load-text")[0].innerText =
                            "retrying " + getDataRetryCount + "/5";
                        sleep(getDataRetryCount * 1000 + 2000);
                        getData();
                    }
                    if (getDataRetryCount == 5) {
                        document.getElementsByClassName("load-text")[0].innerText = "Please try again later.";
                    }
                }
            }

            //=============================================================
            // functions - run when called
            //=============================================================

           function useDataResults() {
                let container = document.getElementById("createleaderboarditems");
                // empty container
                container.innerHTML = "";
                //console.log(data);
                data.forEach((el, i) => {
                    let box = document.createElement("div");
                    box.id = "box" + i;
                    box.className = "team";

					let position = document.createElement("span");
                    position.id = "position" + i;
                    position.className = "position";
					position.innerHTML = el.position;

                    let name = document.createElement("span");
                    name.id = "name" + i;
                    name.className = "name";
                    name.innerHTML = el.players;

                    let day1 = document.createElement("span");
                    day1.id = "day1" + i;
                    day1.className = "day1";
                    day1.innerHTML = el.Saturday;

                    let day2 = document.createElement("span");
                    day2.id = "day2" + i;
                    day2.className = "day2";
                    day2.innerHTML = el.Sunday;

                    let day3 = document.createElement("span");
                    day3.id = "day3" + i;
                    day3.className = "day3";
					day3.innerHTML = el.Monday;

                    let day4 = document.createElement("span");
                    day4.id = "day4" + i;
                    day4.className = "day4";
                    day4.innerHTML = el.Tuesday;

                    let dayfinal = document.createElement("span");
                    dayfinal.id = "dayfinal" + i;
                    dayfinal.className = "dayfinal";
					dayfinal.innerHTML = el.total;
					
                    box.appendChild(position);
                    box.appendChild(name);
                    box.appendChild(day1);
                    box.appendChild(day2);
                    box.appendChild(day3);
                    box.appendChild(day4);
                    box.appendChild(dayfinal);

                    container.appendChild(box);
                    // fade the initial view
                    container.style.opacity = 0.3;
                });

                var k = 0;

                // do proper display

                document.getElementById("createleaderboarditems").style.opacity = 1;

                data.forEach((el, i) => {
                    k++;
                    setTimeout(function () {
                        //if (el.players !== "") {
                        bodyUpdate(el.position, el.player, el.day1, el.day2, el.day3, el.day4, el.dayfinal,i);
                        //}
                    }, k * 300);
                });
            }

            

            function bodyUpdate(xposition, xplayer, xday1, xday2, xday3, xday4, xdayfinal,i) {
                data.find((team) => team.player === xplayer);
                
                let AllTeams = Array.from(document.querySelectorAll(".team"));
                let element = AllTeams[i];
                let elementPos = element.querySelector(".position");
				let elementPlayer = element.querySelector(".name");
                let elementDay1 = element.querySelector(".day1");
                let elementDay2 = element.querySelector(".day2");
                let elementDay3 = element.querySelector(".day3");
                let elementDay4 = element.querySelector(".day4");
                let elementDayFinal = element.querySelector(".dayfinal");
                
                elementPos.innerText = xposition;
                elementPlayer.innerText = xplayer; 
                elementDay1 = xday1;
                elementDay2 = xday2;
                elementDay3 = xday3;
                elementDay4 = xday4;
                elementDayFinal = xdayfinal;
                
              
                // fade in results
                elementPos.style.opacity = 0;
                elementPlayer.style.opacity = 0;
                

                elementPos.style.transition = "opacity 3s";
                elementPlayer.style.transition = "opacity 3s";
                
                elementPos.style.opacity = 1;
                elementPlayer.style.opacity = 1;
                
                element.classList.add("animate");
            }

           
        </script>
    </body>
</html>
