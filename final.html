        <script>
        //=================================================================================
            // this runs on startup or reload
            //
            //=================================================================================
        // Detect whether device supports orientationchange event, otherwise fall back to
      // the resize event.
      var supportsOrientationChange = "onorientationchange" in window,
        orientationEvent = supportsOrientationChange ? "orientationchange" : "resize";

      window.addEventListener(
        orientationEvent,
        function () {
          if (window.orientation == 0) {
            document.getElementById("warning").style.display = "none";
          } else if (window.orientation == 90 || window.orientation == -90) {
            document.getElementById("warning").style.display = "block";
          }
        },
        false
      );

            // prevent default img menu of options
            document.addEventListener("contextmenu", (event) => {
                event.preventDefault();
            });

            // declare global variables
            var childtxt;
            var data;
            var getDataRetryCount = 0;
            // Define the sleep function
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            // global to keep track of screens and not allow interuption
            var allowSwitch = "scores"; // scores > birdies > par 3 > par 5
            //===========================
            // this code runs at startup
            //===========================
            getData();
            //=============================================================
            // functions - run when called
            //=============================================================

            //=============================================================
            // async function getData()
            // - gets results data
            //=============================================================
            async function getData() {
                var url = "https://opensheet.elk.sh/19wHh6ZzDbElLbV7rI9FMPqy7Op0W4LDRGis3mv-XT1U/resultsFinal";

                for (let attempt = 0; attempt < 5; attempt++) {
                    const timeout = attempt * 1000 + 2000;

                    try {
                        //console.log("timeout delay = " + timeout);

                        const dataStream = await fetch(url, {
                            signal: AbortSignal.timeout(timeout)
                        });

                        if (!dataStream.ok) {
                            throw new Error(`Response status: ${dataStream.status}`);
                        }

                        data = await dataStream.json();

                        $("#pagetwo").fadeIn(500);
                        document.getElementById("panel").style.display = "none";

                        if (data[0].players.length > 0) {
                        document.getElementById("panel").style.display = "none";
                            document.getElementById("mainpageleft").innerText = "Leaderboard for Overall positions";
                            useDataResults();
                        } else {
                            useDataHcp();
                        }
                        return; // success — stop retrying
                    } catch (err) {
                        console.error(err);
                        if (err.name === "TimeoutError") {
                            console.error("Timeout: server too busy");
                        } else if (err.name === "AbortError") {
                            console.error("Fetch aborted by user action (browser stop button, closing tab, etc.)");
                        } else {
                            console.error(`Error: type: ${err.name}, message: ${err.message}`);
                        }

                        if (attempt < 4) {
                            const retryNumber = attempt + 1;

                            document.getElementsByClassName("load-text")[0].innerText = `retrying ${retryNumber}/5`;

                            await sleep(retryNumber * 1000 + 2000);
                        } else {
                            document.getElementsByClassName("load-text")[0].innerText = "Please try again later.";
                        }
                    }
                }
            }

            //=============================================================
            // function - to run alternative results screens
            //=============================================================

            document.getElementById("mainpage").style.display = "block";

            var SwipeWidth = window.innerWidth / 3;
            var SwipeWidthMax = 320;

            if (SwipeWidth > SwipeWidthMax) {
                SwipeWidth = SwipeWidthMax;
            }

            var SwipeStartX = null;
            var SwipeEndX = null;
            var SwipeLengthX = null;

            var SwipeStartY = null;
            var SwipeEndY = null;
            var SwipeLengthY = null;

            var SwipeArea = document.documentElement;

            SwipeArea.addEventListener("touchstart", SwipeStart, false);
            SwipeArea.addEventListener("touchend", SwipeEnd, false);

            function SwipeStart(evt) {
                SwipeStartX = evt.changedTouches[0].clientX;
                SwipeStartY = evt.changedTouches[0].clientY;
            }

            function SwipeEnd(evt) {
                SwipeEndX = evt.changedTouches[0].clientX;
                SwipeEndY = evt.changedTouches[0].clientY;

                SwipeLengthX = SwipeStartX - SwipeEndX;
                SwipeLengthY = SwipeStartY - SwipeEndY;

                if (Math.abs(SwipeLengthX) > Math.abs(SwipeLengthY)) {
                    if (SwipeLengthX > SwipeWidth) {
                        if (document.getElementById("mainpageleft").innerText == "Leaderboard for Overall positions") {
                            document.getElementById("mainpageleft").innerText = "Leaderboard for Birdies Champion";
                            allowSwipe = "birdies";
                            textEvent("Leaderboard for Birdies Champion");
                            k = 1;
                            data.forEach((el, i) => {
                                document.getElementById("position" + i).style.color = "gray";
                                document.getElementById("name" + i).style.color = "gray";
                                document.getElementById("scores" + i).style.color = "gray";
                                k++;
                                setTimeout(function () {
                                    if (allowSwipe == "birdies") {
                                        document.getElementById("position" + i).style.color = "white";
                                        document.getElementById("name" + i).style.color = "white";
                                        document.getElementById("scores" + i).style.color = "white";
                                        bodyUpdateBirdies(el.namebirdies, el.scorebirdies, el.positionbirdies, i);
                                    }
                                }, k * 100);
                            });
                            /* birdies move to par 3 */
                            } else if (document.getElementById("mainpageleft").innerText == "Leaderboard for Birdies Champion") {
                            document.getElementById("mainpageleft").innerText = "Leaderboard for Par 3 Champion";
                            allowSwipe = "par3";
                            textEvent("Leaderboard for Par 3 Champion");
                            k = 1;
                            data.forEach((el, i) => {
                                document.getElementById("position" + i).style.color = "gray";
                                document.getElementById("name" + i).style.color = "gray";
                                document.getElementById("scores" + i).style.color = "gray";
                                k++;
                                setTimeout(function () {
                                    if (allowSwipe == "par3") {
                                        document.getElementById("position" + i).style.color = "white";
                                        document.getElementById("name" + i).style.color = "white";
                                        document.getElementById("scores" + i).style.color = "white";
                                        bodyUpdatep3(el.namep3, el.scorep3, el.positionp3, i);
                                    }
                                }, k * 100);
                            });
                        } else if (document.getElementById("mainpageleft").innerText == "Leaderboard for Par 3 Champion") {
                            /* par 3 move to par 5 */
                            document.getElementById("mainpageleft").innerText = "Leaderboard for Par 5 Champion";
                            allowSwipe = "par5";
                            textEvent("Leaderboard for Par 5 Champion");
                            k = 1;

                            data.forEach((el, i) => {
                                document.getElementById("position" + i).style.color = "gray";
                                document.getElementById("name" + i).style.color = "gray";
                                document.getElementById("scores" + i).style.color = "gray";
                                k++;
                                setTimeout(function () {
                                    if (allowSwipe == "par5") {
                                        document.getElementById("position" + i).style.color = "white";
                                        document.getElementById("name" + i).style.color = "white";
                                        document.getElementById("scores" + i).style.color = "white";
                                        bodyUpdatep5(el.namep5, el.scorep5, el.positionp5, i);
                                    }
                                }, k * 100);
                            });
                        }
                    } else if (SwipeLengthX < SwipeWidth) {
                        /* right swipe */
                        /* par 5 > par 3 > birdies > scores */
                        /* par 5 move to par 3 */
                        if (document.getElementById("mainpageleft").innerText == "Leaderboard for Par 5 Champion") {
                            document.getElementById("mainpageleft").innerText = "Leaderboard for Par 3 Champion";
                            allowSwipe = "par3";
                            textEvent("Leaderboard for Par 3 Champion");
                            k = 1;

                            data.forEach((el, i) => {
                                document.getElementById("position" + i).style.color = "gray";
                                document.getElementById("name" + i).style.color = "gray";
                                document.getElementById("scores" + i).style.color = "gray";
                                k++;
                                setTimeout(function () {
                                    if (allowSwipe == "par3") {
                                        document.getElementById("position" + i).style.color = "white";
                                        document.getElementById("name" + i).style.color = "white";
                                        document.getElementById("scores" + i).style.color = "white";
                                        bodyUpdatep3(el.namep3, el.scorep3, el.positionp3, i);
                                    }
                                }, k * 100);
                            });
                            /* par 3 move to birdies */
                        } else if (document.getElementById("mainpageleft").innerText == "Leaderboard for Par 3 Champion") {
                            document.getElementById("mainpageleft").innerText = "Leaderboard for Birdies Champion";
                            allowSwipe = "birdies";
                            textEvent("Leaderboard for Birdies Champion");
                            k = 1;

                            data.forEach((el, i) => {
                                document.getElementById("position" + i).style.color = "gray";
                                document.getElementById("name" + i).style.color = "gray";
                                document.getElementById("scores" + i).style.color = "gray";
                                k++;
                                setTimeout(function () {
                                    if (allowSwipe == "birdies") {
                                        document.getElementById("position" + i).style.color = "white";
                                        document.getElementById("name" + i).style.color = "white";
                                        document.getElementById("scores" + i).style.color = "white";
                                        bodyUpdateBirdies(el.namebirdies, el.scorebirdies, el.positionbirdies, i);
                                    }
                                }, k * 100);
                            });
                        } else if (document.getElementById("mainpageleft").innerText == "Leaderboard for Birdies Champion") {
                            /* birdies move to scores */
                            //document.getElementById("panel").style.display = "none";
                            document.getElementById("mainpageleft").innerText = "Leaderboard for Overall positions";
                            allowSwipe = "scores";
                            textEvent("Leaderboard for Overall positions");
                            k = 1;

                            data.forEach((el, i) => {
                                document.getElementById("position" + i).style.color = "gray";
                                document.getElementById("name" + i).style.color = "gray";
                                document.getElementById("scores" + i).style.color = "gray";
                                //console.log(el.players, el.playerpoints);
                                k++;
                                setTimeout(function () {
                                    if (allowSwipe == "scores") {
                                        document.getElementById("position" + i).style.color = "white";
                                        document.getElementById("name" + i).style.color = "white";
                                        document.getElementById("scores" + i).style.color = "white";
                                        bodyUpdateScores(el.players, el.playerpoints, i);
                                    }
                                }, k * 100);
                            });
                        }
                    }
                }
            }

            //=============================================================
            // functions - run when called
            //=============================================================

            function useDataResults() {
                let container = document.getElementById("createleaderboarditems");
                // empty container
                container.innerHTML = "";
                //console.log(data);
                data.forEach((el, i) => {
                    let box = document.createElement("div");
                    box.id = "box" + i;
                    box.className = "team";
                    box.setAttribute("onclick", "showStats(this.id);return false;");

                    let name = document.createElement("span");
                    name.id = "name" + i;
                    name.className = "name";
                    name.innerHTML = el.players;

                    let scores = document.createElement("span");
                    scores.id = "scores" + i;
                    scores.className = "scores";

                    let position = document.createElement("span");
                    position.id = "position" + i;
                    position.className = "position";
                    position.innerHTML = i;

                    let birdgif = document.createElement("span");
                    birdgif.id = "birdgif" + i;
                    birdgif.className = "birdgif";

                    let birdgifnumber = document.createElement("span");
                    birdgifnumber.id = "birdgifnumber" + i;
                    birdgifnumber.className = "birdgifnumber";

                    let birdimg = document.createElement("img");
                    birdimg.id = "birdimg" + i;
                    birdimg.className = "birdimg";
                    birdimg.src = "bird.gif";

                    let birdcount = document.createElement("img");
                    birdcount.id = "birdcount" + i;
                    birdcount.className = "birdimg";

                    birdgif.appendChild(birdimg);
                    birdgifnumber.appendChild(birdcount);

                    box.appendChild(position);
                    box.appendChild(name);

                    box.appendChild(birdgif);
                    box.appendChild(birdgifnumber);

                    box.appendChild(scores);

                    container.appendChild(box);
                    // fade the initial view
                    container.style.opacity = 0.3;
                });

                var k = 0;

                // do proper display
                document.getElementById("createleaderboarditems").style.opacity = 1;

                data.forEach((el, i) => {
                    k++;
                    setTimeout(function () {
                        bodyUpdate(el.players, el.playerpoints, i);
                    }, k * 300);
                });
            }

            function bodyUpdate(nom, points, i) {
                let pos = i + 1;
                //console.log("bodyUpdate = ", nom, points);
                data.find((team) => team.players === nom);
                // now sort out positions for same scores
                let AllTeams = Array.from(document.querySelectorAll(".team"));
                let element = AllTeams[i];
                let elementPos = element.querySelector(".position");
                let elementScore = element.querySelector(".scores");
                let elementName = element.querySelector(".name");
                // cope with first position
                if (i < 1) {
                    let previousElement = AllTeams[i];
                    let previousElementPos = previousElement.querySelector(".position");
                    let previousElementScore = previousElement.querySelector(".scores");
                    elementPos.innerHTML = pos;
                } else {

            function drawGraph(arrMyPoints1, arrMyPoints2, arrMyPoints3, arrMyPoints4, arrMyPoints5) {
                var PlayerGraph;
                const xValues = ["eagles", "birdies", "pars", "bogeys", "worse"];
                var barColors = ["#8867e1", "#be59f5", "#65b0d6", "#40ffc6", "#c8df6f"];
                var borderColors = ["black"];
                var ctx = document.getElementById("myChart");
                try {
                    var PlayerGraph = Chart.getChart("myChart");
                    if (PlayerGraph) {
                        PlayerGraph.destroy();
                    }
                } catch (e) {
                    console.log("error: " + e);
                }

                Chart.defaults.font.size = 16;
                Chart.defaults.color = "white";

                const footer = (tooltipItems) => {
                    let sum = 0;
                    tooltipItems.forEach(function (tooltipItem) {
                        sum += tooltipItem.parsed.y;
                    });
                    return "Sum: " + sum;
                };

                var PlayerGraph = new Chart(ctx, {
                    type: "bar",
                    data: {
                        labels: xValues,
                        datasets: [
                            {
                                backgroundColor: barColors[0],
                                data: arrMyPoints1,
                                borderColor: borderColors[0],
                                borderWidth: 2,
                                borderSkipped: false
                            },
                            {
                                backgroundColor: barColors[1],
                                data: arrMyPoints2,
                                borderColor: borderColors[0],
                                borderWidth: 2,
                                borderSkipped: false
                            },
                            {
                                backgroundColor: barColors[2],
                                data: arrMyPoints3,
                                borderColor: borderColors[0],
                                borderWidth: 2,
                                borderSkipped: false
                            },
                            {
                                backgroundColor: barColors[3],
                                data: arrMyPoints4,
                                borderColor: borderColors[0],
                                borderWidth: 2,
                                borderSkipped: false
                            },
                            {
                                backgroundColor: barColors[4],
                                data: arrMyPoints5,
                                borderColor: borderColors[0],
                                borderWidth: 2,
                                borderSkipped: false
                            }
                        ]
                    },

                    options: {
                        plugins: {
                            title: {
                                display: true,
                                text: "     " + childtxt + " - How you've played ..."
                            },
                            legend: {
                                display: false
                            },
                            tooltip: {
                                mode: "index",
                                intersect: false,
                                // 1. Reverse order of displayed tooltip items
                                itemSort: function (a, b) {
                                    return b.datasetIndex - a.datasetIndex;
                                },
                                callbacks: {
                                    // 2. Sum all active stacked values and return in a footer
                                    footer: function (tooltipItems) {
                                        let sum = 0;
                                        tooltipItems.forEach(function (item) {
                                            sum += item.parsed.y;
                                        });
                                        return "Total: " + sum.toLocaleString();
                                    }
                                }
                            }
                        },
                        responsive: true,
                        scales: {
                            x: {
                                stacked: true,
                                grid: {
                                    display: false
                                }
                            },
                            y: {
                                stacked: true,
                                grid: {
                                    display: true,
                                    color: "#3A3B3C"
                                }
                            }
                        }
                    }
                });
            }

            /* -- Text random effect -- */
            function textEvent(originaltext) {
                let result = " ";
                const charlength = document.getElementById("mainpageleft").innerText.length;
                //var originaltext = document.getElementById("headermainpage").innerText;
                const letters = "AaBbCcDdEeFfGgHhIiJjKkLlMmNnOoPpQqRrSsTtUuVvWwXxYyZz".substring(0, charlength);
                var count = 0;
                var tempresult = "";
                // set color
                document.getElementById("mainpageleft").style.color = "dodgerBlue";
                clearInterval(interval);
                var interval = setInterval(() => {
                    count++;
                    result = "";
                    tempresult = "";
                    // create a string
                    for (let i = 0; i < charlength; i++) {
                        tempresult = letters.charAt(Math.floor(Math.random() * charlength));
                        if (originaltext.charAt(i) == " ") {
                            tempresult = " ";
                        }
                        result += tempresult;
                    }
                    console.log(result);
                    // write string
                    document.getElementById("mainpageleft").innerText = result;
                    if (count > 10) {
                        clearInterval(interval);
                        document.getElementById("mainpageleft").innerText = originaltext;
                        document.getElementById("mainpageleft").style.color = "dodgerBlue";
                    }
                }, 30);
            }
