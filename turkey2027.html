                                  /* main square menu item */
                                  .square_menu_icon {
                                    display: block;
                                    position: absolute;
                                    overflow: hidden;
                                    margin: 0;
                                    padding: 0;
                                    width: 45px;
                                    height: 45px;
                                    font-size: 0;
                                    text-indent: -9999px;
                                    appearance: none;
                                    box-shadow: none;
                                    border: none;
                                    cursor: pointer;
                                    transition: background 0.3s;
                                    top: 57%;
                                    left: 50%;
                                    transform: translate(-50%, -50%);
                                    background-color: transparent;
                                    z-index: 99;
                                  }

                                  .square_menu_icon:focus {
                                    outline: none;
                                  }

                                  .square_menu_icon span {
                                    display: block;
                                    position: absolute;
                                    top: 15px;
                                    left: 0;
                                    right: 0;
                                    height: 7px;
                                    background: #fff;
                                  }

                                  .square_menu_icon span:before,
                                  .square_menu_icon span:after {
                                    position: absolute;
                                    display: block;
                                    left: 0;
                                    width: 100%;
                                    height: 7px;
                                    background-color: #fff;
                                    content: "";
                                  }

                                  .square_menu_icon span:before {
                                    top: -14px;
                                  }

                                  .square_menu_icon span:after {
                                    bottom: -14px;
                                  }

                                  .square_menu_icon-X span {
                                    transition: background 0s 0.3s;
                                  }

                                  .square_menu_icon-X span:before,
                                  .square_menu_icon-X span:after {
                                    transition-duration: 0.3s, 0.3s;
                                    transition-delay: 0.3s, 0s;
                                  }

                                  .square_menu_icon-X span:before {
                                    transition-property: top, transform;
                                  }

                                  .square_menu_icon-X span:after {
                                    transition-property: bottom, transform;
                                  }

                                  .square_menu_icon-X.is-active span {
                                    background: none;
                                  }

                                  .square_menu_icon-X.is-active span:before {
                                    top: 0;
                                    transform: rotate(45deg);
                                  }

                                  .square_menu_icon-X.is-active span:after {
                                    bottom: 0;
                                    transform: rotate(-45deg);
                                  }

                                  .square_menu_icon-X.is-active span:before,
                                  .square_menu_icon-X.is-active span:after {
                                    transition-delay: 0s, 0.3s;
                                  }

    <script>
      // Detect whether device supports orientationchange event, otherwise fall back to
      // the resize event.
      var supportsOrientationChange = "onorientationchange" in window,
        orientationEvent = supportsOrientationChange ? "orientationchange" : "resize";

      window.addEventListener(
        orientationEvent,
        function () {
          if (window.orientation == 0) {
            document.getElementById("warning").style.display = "none";
          } else if (window.orientation == 90 || window.orientation == -90) {
            document.getElementById("warning").style.display = "block";
          }
        },
        false
      );

      /* temporary show countdown */
      var oneDay = 24 * 60 * 60 * 1000; // hours*minutes*seconds*milliseconds
      var firstDate = new Date("06/08/2026 00:1 AM");
      var tempDate = new Date();
      var y = tempDate.getFullYear().toString();
      var xm = tempDate.getMonth();
      var d = tempDate.getDate();
      xm++;
      m = xm.toString();
      var dstring = m + "/" + d + "/" + y + " 00:1 AM";
      // get first day of trip
      var secondDate = new Date(dstring);
      //var secondDate = new Date();
      var diffDays = Math.round(Math.abs((firstDate - secondDate) / oneDay));
      // disable run ...
      if (1 == 2) {
        //if (firstDate > secondDate) {
        if (diffDays < 14) {
          // show marquee for last 14 days
          document.getElementById("marquee").style.display = "block";
          setTimeout(function () {
            document.getElementById("marquee").style.display = "none";
          }, 9000);
          // show dancing man for last 14 days
          document.getElementById("overlay").style.display = "block";
          setTimeout(function () {
            document.getElementById("overlay").style.display = "none";
          }, 9000);
        }
        i = 0;
        var x = setInterval(function () {
          i++;
          if (i >= diffDays) {
            clearInterval(x);
          }
          if (i == 1) {
            document.getElementById("marqueemsg").innerHTML =
              '<img id="imgx" src="dance.gif" alt="x" style="float: center; height: 7vh;">' + i + " day to go ";
          } else {
            document.getElementById("marqueemsg").innerHTML =
              '<img id="imgx" src="dance.gif" alt="x" style="float: center; height: 7vh;">' + i + " days to go ";
          }
        }, 2500 / diffDays);
      }

      /* end of temporary show countdown */

      function nocountdown() {
        document.getElementById("countdown").style.display = "none";
        document.getElementById("overlay").style.display = "none";
      }

      // global variables
      var grayedout = "yes";
      // menu code
      var isTop = true;
      var menuIsOpen = false;
      var menuIcon = $(".square_menu_icon");
      var bubblemenu = $(".bubble_menu");
      var one = $("#one");
      var two = $("#two");
      var three = $("#three");
      var four = $("#four");
      var five = $("#five");
      var six = $("#six");
      var seven = $("#seven");
      var eight = $("#eight");
      // menuIcon.click(function() {
      bubblemenu.click(function () {
        if (isTop === true) {
          $("#nav").animate(
            {

              left: "50%"
            },
            400
          );
          $(".content").animate(
            {
              opacity: "0"
            },
            700
          );
          showBubbles();
          isTop = false;
        } else {
          if (menuIsOpen === false) {
            showBubbles();
          } else {
            hideBubbles();
          }
        }
      });

      function showBubbles() {
        one.css("opacity", "0.0");
        two.css("opacity", "0.0");
        three.css("opacity", "0.0");
        four.css("opacity", "0.0");
